name: tests

# Single-stack test suite: TypeScript services, built-in SQLite, and renderer E2E.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Node 24 provides node:sqlite, matching the Electron application runtime.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install root deps
        run: npm ci
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      # ── Playwright browser for the E2E tier ──
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # ── Run everything: API + DB + E2E ──
      - name: Run test suite
        run: npm test
      - name: Verify desktop build and route/security gates
        run: npm run typecheck --prefix desktop && npm run verify:renderer-routes --prefix desktop && npm run verify:portal-security --prefix desktop

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/reports/playwright
          retention-days: 7
